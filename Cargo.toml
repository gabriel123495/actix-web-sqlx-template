[package]
name = "database"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.13.0"
sqlx = { version = "0.8.6", features = ["mysql", "macros", "runtime-tokio"] }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"
chrono = "0.4.44"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
